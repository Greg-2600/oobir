name: UI Selenium Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-selenium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Start API and web servers
        run: |
          nohup python -m uvicorn flow_api:app \
            --host 127.0.0.1 --port 8000 > /tmp/oobir-api.log 2>&1 &
          nohup python -m http.server 8081 \
            --directory web > /tmp/oobir-web.log 2>&1 &

      - name: Wait for services
        run: |
          for _ in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:8000/health >/dev/null \
              && curl -sSf http://127.0.0.1:8081/index.html >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready in time"
          echo "API log:"
          cat /tmp/oobir-api.log || true
          echo "Web log:"
          cat /tmp/oobir-web.log || true
          exit 1

      - name: Run Selenium UI smoke tests
        env:
          BASE_URL: http://127.0.0.1:8081
          UI_BROWSERS: chrome
          HEADLESS: "1"
          WAIT_TIMEOUT: "30"
        run: |
          python -m pytest \
            tests/ui/test_ui.py::TestEnhancedNavigationUX::test_since_last_view_badge_updates_after_revisit \
            tests/ui/test_ui.py::TestEnhancedNavigationUX::test_revisit_marker_toggle_hides_and_shows_related_markers \
            -q --maxfail=1 --tb=short

      - name: Print logs on failure
        if: failure()
        run: |
          echo "API log:"
          cat /tmp/oobir-api.log || true
          echo "Web log:"
          cat /tmp/oobir-web.log || true
