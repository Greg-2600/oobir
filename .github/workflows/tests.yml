name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: oobir-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Run unit tests
        env:
          OOBIR_ENV: test
          # Closed local port so an unmocked call cannot reach a live LLM or market host.
          OLLAMA_HOST: http://127.0.0.1:9
          OLLAMA_URL: http://127.0.0.1:9
          OLLAMA_BASE_URL: http://127.0.0.1:9
        run: |
          python -m pytest tests \
            --ignore=tests/ui \
            --ignore=tests/scripts \
            -q --tb=short
